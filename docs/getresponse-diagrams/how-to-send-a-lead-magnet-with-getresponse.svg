<text x="256" y="585" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#f5f3e8" text-anchor="middle">PDF delivery</text>
<text x="256" y="643" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#f5f3e8" text-anchor="middle">Fulfill the promise.</text>
<text x="720" y="354" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#f5f3e8" text-anchor="middle">Day 2</text>
<circle cx="720" cy="447" r="57" fill="#f0cad1"/>
<text x="720" y="463" font-family="DejaVu Sans" font-size="47" font-weight="600" fill="#11402d" text-anchor="middle">2</text>
<text x="720" y="585" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#f5f3e8" text-anchor="middle">Useful tip</text>
<text x="720" y="643" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#f5f3e8" text-anchor="middle">Make one thing easier.</text>
