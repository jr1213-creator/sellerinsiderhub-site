<title id="title">A GetResponse lead magnet welcome sequence</title>
<desc id="desc">Example timeline: Day 0 delivers the PDF, Day 2 shares a useful tip, and Day 5 offers a service invitation. Timing is illustrative and can be adjusted.</desc>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#11402d"/>
